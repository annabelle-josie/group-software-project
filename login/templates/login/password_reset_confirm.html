{% extends 'base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="d-flex justify-content-center" style="min-height: 85vh;">
  <div class="container text-center mt-5">
    <div class="bg-success-subtle rounded p-5 m-5">
      <h2>Set New Password</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">Change my password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
