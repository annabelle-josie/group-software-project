{% extends 'base.html' %}
{% load auth_extras %}

{% block title %} Home {% endblock %}

{% block content %}
<h1>all challenges</h1>
<div class="row h-100">
    <div class="col-12" style=" background-color: rgb(255, 176, 176)">
        <h2 class="mt-2">Current Tasks</h2>
        <ul class="list-group">
            <li class="list-group-item">
                {% for item in challenge_list%}
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                    <label class="form-check-label" for="flexCheckDefault">
                        {{item.title}}-{{item.desc}}-has {{item.noOfTasks}} tasks left, you will get {{item.rewardValue}}, 
                        <button class="remove-button btn btn-primary mt-1"  data-tasks="{{item.noOfTasks}}" data-id="{{item.challengeId}}" data-points="{{item.rewardValue}}">complete</button>
                </div>
                <p> {% empty %} no challenges left</p>
                {% endfor %}
                
            </li>
        </ul>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Get all remove buttons
        const removeButtons = document.querySelectorAll('.remove-button');
        removeButtons.forEach(button => {
            button.addEventListener('click', function () {
                // Get the itemType (barcode) from data attribute
                const challengeId = button.getAttribute('data-id');
                const points = button.getAttribute('data-points');
                const tasks = button.getAttribute('data-tasks')
                const confirmRemove = confirm('Are you sure you have completed this task');
                if (confirmRemove) {
                    if (tasks <= 1){
                    // Send DELETE request using fetch
                    fetch('api/v1/removeChallenge', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}', // Ensure CSRF token is sent
                        },
                        body: JSON.stringify({
                            challengeId: challengeId, // Pass the barcode as itemType
                            points : points
                        }) 
                    })
                    .then(response => {
                        if (response.ok) {
                            alert('challenge completed!');
                            location.reload(); // Refresh the page after successful removal
                        } else {
                            alert('Error completing challenge.');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Error completing challenge.');
                    });
                }
            else {
                    // Send DELETE request using fetch
                    fetch('api/v1/removeTask', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}', // Ensure CSRF token is sent
                        },
                        body: JSON.stringify({
                            tasks: tasks, // Pass the barcode as itemType
                            challengeId: challengeId
                        }) 
                    })
                    .then(response => {
                        if (response.ok) {
                            alert('task completed!');
                            location.reload(); // Refresh the page after successful removal
                        } else {
                            alert('Error completing task.');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Error completing task.');
                    });
                }
                
            }
            });
        });
    });
</script>
{% endblock %}
