{% extends 'base.html' %}
{% load auth_extras %}
{% load static %}

{% block title %} Market {% endblock %}

{% block content %}

<!-- Header Section -->
<div class="h-50 row" style=" background-color: rgb(176, 239, 255)">
    <img id="chosen-plant-image" class="mt-3 col-6" alt="Click a plant to select" src="{% static 'placeholder.jpg' %}" style="max-height: 80%; max-width: 80%; width: auto;">
    <div id="chosen-plant-facts" class="col-6">
        <p>Your Leaves: {{leaves}}</p>
        <h1>Plants</h1>
        <h2 id="chosen-plant-name">Name: </h2>
        <h2 id="chosen-plant-cost">Cost: </h2>
        <h2 id="chosen-plant-fact">Fun Fact: </h2>
        <button class="btn btn-primary">Buy plant</button>
    </div>
</div>

<!-- Plant List Section -->
<div class="h-50" style="background-color: rgb(255, 176, 221)">
    <div class="row overflow-scroll" style="max-width: 100%; max-height: 100%;">
        {% for plant in plants %}
            <button class="col-3" onClick='
                document.getElementById("chosen-plant-image").setAttribute("src", "{{ plant.image.url }}");
                document.getElementById("chosen-plant-name").innerHTML = "Name: {{ plant.name }}";
                document.getElementById("chosen-plant-cost").innerHTML = "Cost: {{ plant.price }}";
                document.getElementById("chosen-plant-fact").innerHTML = "Fact: {{ plant.fact }}";
            '>
                <img alt="{{ plant.name }}" src="{{ plant.image.url }}" width="100px">
                <p>{{ plant.name }}</p>
            </button>
        {% endfor %}
    </div>
</div>

{% endblock %}
