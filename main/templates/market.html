{% extends 'base.html' %}
{% load static %}

{% block title %} Market {% endblock %}

{% block content %}
<h1 class="text-center mt-4">Market</h1>

<div class="container">
    <div class="row">
        {% for plant in plants %}
        <div class="col-md-4 d-flex align-items-stretch"> 
            <div class="card shadow-sm text-center" style="width: 100%;">
                <img src="{{ plant.image.url }}" class="card-img-top img-fluid" 
                     alt="{{ plant.name }}" style="height: 350px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ plant.name }}</h5>
                    
                    <div class="description-box" style="max-height: 100px; overflow-y: auto; padding: 5px;">
                        <p class="card-text">{{ plant.fact }}</p>
                    </div>

                    <div class="mt-auto">
                        <p class="text-muted">Price: {{ plant.price }} leaves</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
