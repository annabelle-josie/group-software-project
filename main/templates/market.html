<div class="h-50" style="background-color: rgb(255, 176, 221)">

        {% for plant_key, plant_value in plants.items %}
            <button class="col-3" onClick='document.getElementById("chosen-plant-image").setAttribute("src", "{% static plant_value %}");'>

</div>
