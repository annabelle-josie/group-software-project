{% extends 'base.html' %}
{% load auth_extras %}

{% block title %} Home {% endblock %}

{% block content %}

<h1>Market Page</h1>

{% load static %}

<div class="h-50" style=" background-color: rgb(176, 239, 255)">
    <div class="row">
        <img class="mt-3 col-6" alt="ajhhh" src="{% static plants.bla %}" style="max-height: 80%; max-width: 80%;">
        <div class="col-6">
            <h1>Plants</h1>
            <h2>Name: </h2>
            <h2>Cost: </h2>
            <h2>Description: </h2>
            <h2>Fun Fact: </h2>
        </div>
    </div>
</div>

<div class="h-50" style="background-color: rgb(255, 176, 221)">
    <div class="row overflow-scroll" style="max-width: 100%; max-height: 100%;">
        {% for plant_key, plant_value in plants.items %}
            <div  class="col-3">
                <img alt="{{plant_key}}" src="{% static plant_value %}"  width="100px">
                <p>{{plant_key}}</p>
            </div>
        {% endfor %}
    </div>
</div>


{% endblock %}
