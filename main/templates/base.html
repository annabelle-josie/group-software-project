<html lang="en">
<head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
{% load static %}
<!-- Custom Styles for a Thinner Navbar and Larger, Better-Spaced Text -->
<style>
    .navbar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1030;
        background-color: #f8f9fa;
        padding: 0.2rem 1rem; /* Adjust to control navbar thickness */
    }
    .navbar-overlay .container-fluid {
        padding: 0;
    }
    .navbar-overlay .nav-link {
        font-size: 1.0rem;      /* Adjust to control link text size of the navbar */
        padding: 0rem 0;      /* Adjust to control spacing */
        margin: 0.5rem 0;
    }

    .navbar-overlay .navbar-brand img {
        max-height: 50px; /* Adjust this value for thinner images on the navbar */
    }

    .navbar-overlay .navbar-brand img.leaf {
        padding: 0.2rem 1rem;
    }

    body {
        padding-top: 60px; 
    }
</style>

<nav class="navbar navbar-light fixed-top navbar-overlay">
    <div class="container-fluid">
      <!-- Brand -->
    <a class="navbar-brand" href="/">
        <img src="{% static 'icons/logo.png' %}" alt="site icon">
    </a>
      <!-- User Info -->
    <div class="d-flex align-items-center">
        {% if user.is_authenticated %}
          <p class="mb-0 me-3">{{ user.username }}</p>
          <div class="d-flex align-items-center border rounded p-2">
            <p class="mb-0">{{ user.stats.leaves }}</p>
            <img src="{% static 'icons/leaf.png' %}" height="25px" class="ms-2" alt="leaf icon">
          </div>
        {% else %}
          <span>Guest</span>
        {% endif %}
    </div>

    <!-- Collapsible Menu with Grid Layout -->
    <div class="nav-item dropdown me-1">
        <a class="nav-link d-flex align-items-center" href="#" id="navbarDropdown" role="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </a>
        <!-- Dropdown Items -->
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
          <li><a class="dropdown-item" href="/">Home</a></li>
          <li><a class="dropdown-item" href="/garden">Garden</a></li>
          <li><a class="dropdown-item" href="/events">Events</a></li>
          <li><a class="dropdown-item" href="/leaderboard">Leaderboard</a></li>
          <li><a class="dropdown-item" href="/market">Market</a></li>
          <li><a class="dropdown-item" href="/settings">Settings</a></li>
          {% if user.is_authenticated %}
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" id="logoutButton">Log Out</a></li>
          {% endif %}
        </ul>
      </div>
  </div>
</nav>

{% block content %}
{% endblock %}
  
    
<!-- JavaScript to handle logout without a form -->
<script>
    document.getElementById("logoutButton").addEventListener("click", function (event) {
        event.preventDefault();  // Prevent normal link behavior
        fetch("{% url 'logout' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "Content-Type": "application/json"
            },
            credentials: "same-origin"
        }).then(response => {
            if (response.ok) {
                window.location.href = "/";  // Redirect to home after logout
            }
        }).catch(error => console.error("Logout failed", error));
    });
</script>

</body>
</html>
