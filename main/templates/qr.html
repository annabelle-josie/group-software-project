<html lang="en">
    
<head>
    <title>{% block title %}{% endblock %}</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto my-2 my-lg-0">
            <li class="nav-item active">
                <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
            </li>
            
            {% if user.is_authenticated %}
                <li class="nav-item d-flex align-items-center"> <!-- Forces vertical alignment -->
                    <form action="{% url 'logout' %}" method="post" class="m-0 p-0">
                        {% csrf_token %}
                        <button type="submit" class="nav-link btn btn-link p-0 m-0" style="border: none; background: none;">
                            Log Out
                        </button>
                    </form>
                </li>
            {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">Log In</a>
                </li>
            {% endif %}
        </ul>
    </div>
</nav>
    {% block content %}
    <div class="container">
        <h1>QR Code Generator</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Generate QR Code</button>
        </form>
        {% if qr_image_base64 %}
            <div class="qr-code">
                <h2>Your QR Code</h2>
                <img src="data:image/png;base64,{{ qr_image_base64 }}" alt="QR Code">
                <br>
                <a href="{% url 'qr' %}">Generate another QR Code</a>
            </div>
        {% endif %}
    </div>
    {% endblock %}
</body>
<script>
</script>
